<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
<title id="title">Which functions run from faster memory?</title>
<desc id="desc">Execution addresses in the last flashed image; QSPI also holds the load copies of code that runs in RAM.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566B7B"/></marker></defs>
<rect x="0" y="0" width="1800" height="1320" rx="0" fill="#F5F8FB"/>
<text x="60" y="53" font-family="DejaVu Sans" font-size="19" font-weight="700" text-anchor="start" fill="#566B7B">PROTOMATE  /  CURRENT IMPLEMENTATION</text>
<text x="60" y="110" font-family="DejaVu Sans" font-size="43" font-weight="700" text-anchor="start" fill="#183044">Which functions run from faster memory?</text>
<text x="60" y="156" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#566B7B">Execution addresses in the last flashed image; QSPI also holds the load copies of code that runs in RAM.</text>
<text x="1740" y="61" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="end" fill="#566B7B">03 / 04</text>
<path d="M60,183 L1740,183" fill="none" stroke="#D7E1E9" stroke-width="2"/>
<rect x="60" y="216" width="812" height="851" rx="14" fill="#EAF7F4" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="84" y="258" font-family="DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" fill="#007D78">M4 · execution and communication</text>
<rect x="908" y="216" width="832" height="851" rx="14" fill="#EDF4FE" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="932" y="258" font-family="DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" fill="#245EA8">M7 · presentation and planning</text>
<rect x="84" y="284" width="764" height="388" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="108" y="323" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#007D78">Internal SRAM · fast code region</text>
<text x="108" y="359" font-family="DejaVu Sans Mono" font-size="20" font-weight="400" text-anchor="start" fill="#566B7B">0x10000800 · 192 KiB reserved</text>
<text x="108" y="400" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">STEP generation</text>
<text x="108" y="422" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">StepGenerator, StepHardware, StepOutput</text>
<text x="108" y="444" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">Motion evaluation</text>
<text x="108" y="466" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">Executor, ProfileSchedule, Profile, Sequence</text>
<text x="108" y="488" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">Motor / safety paths</text>
<text x="108" y="510" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">StepperMotor, feedback, driver fault handling</text>
<text x="108" y="532" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">Communication paths</text>
<text x="108" y="554" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">Bridge, ServiceBridge, ActionBridge, transport</text>
<text x="108" y="576" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">Runtime / helpers</text>
<text x="108" y="598" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">ThreadX, clock, notification, selected libc/libgcc</text>
<text x="108" y="634" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#B63B43">195,280 / 196,608 B · 99.32% · only 1,328 B remain</text>
<rect x="108" y="648" width="716" height="10" rx="5.0" fill="#D7E1E9"/>
<rect x="108" y="648" width="711.1637369791667" height="10" rx="5.0" fill="#007D78"/>
<rect x="84" y="690" width="764" height="207" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="108" y="729" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="start" fill="#007D78">External SDRAM · ordinary M4 code</text>
<text x="108" y="765" font-family="DejaVu Sans Mono" font-size="20" font-weight="400" text-anchor="start" fill="#566B7B">0xC0400000 · 600,984 B linked</text>
<text x="108" y="805.0" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">Server dispatch, admission code and remaining application helpers</text>
<text x="108" y="834.4" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">run here in the flashed test. This avoids their QSPI instruction</text>
<text x="108" y="863.8" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">fetches; it is not equivalent to internal SRAM.</text>
<rect x="84" y="915" width="764" height="127" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="108" y="952" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start" fill="#7353A6">QSPI · remaining read-only material</text>
<text x="108" y="990.0" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">Ordinary constants generally remain in flash; constants selected</text>
<text x="108" y="1019.4" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">with fast code move to internal SRAM.</text>
<rect x="932" y="284" width="784" height="248" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="956" y="323" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="start" fill="#245EA8">ITCM · selected TGX renderer routines</text>
<text x="956" y="359" font-family="DejaVu Sans Mono" font-size="20" font-weight="400" text-anchor="start" fill="#566B7B">0x00000000 · 16,088 B linked</text>
<text x="956" y="402" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" text-anchor="start" fill="#183044">_drawMesh     uber_shader     _discardBox</text>
<text x="956" y="447.0" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">Selected geometry / raster paths avoid external instruction fetches.</text>
<text x="956" y="476.4" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">The current allocation is below the 24 KiB renderer cap.</text>
<rect x="932" y="550" width="784" height="231" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="956" y="589" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#7353A6">QSPI + M7 instruction cache</text>
<text x="956" y="625" font-family="DejaVu Sans Mono" font-size="20" font-weight="400" text-anchor="start" fill="#566B7B">Ordinary application starts at 0x90400000</text>
<text x="956" y="668.0" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">GUI, CLI, Robot and Planner code execute here. The M7 caches</text>
<text x="956" y="698.8" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">instructions; the M4 does not have an equivalent instruction</text>
<text x="956" y="729.6" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">cache.</text>
<rect x="932" y="799" width="784" height="243" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="956" y="838" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="start" fill="#245EA8">DTCM · planning stack and CPU data</text>
<text x="956" y="884.0" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">The planning worker has a static 24 KiB DTCM stack. Its large</text>
<text x="956" y="916.2" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">planning arena is in SDRAM.</text>
<path d="M956,951 L1692,951" fill="none" stroke="#D7E1E9" stroke-width="2"/>
<text x="956" y="986.0" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#245EA8">A fast stack does not place the planner’s functions in</text>
<text x="956" y="1018.2" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#245EA8">ITCM.</text>
<rect x="60" y="1091" width="1680" height="145" rx="14" fill="#FFF5DF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="84" y="1132" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="start" fill="#A8680C">Important configuration distinction</text>
<text x="84" y="1175.0" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">Last flashed test: GIGA_M4_SDRAM_CODE=ON. Source default: OFF, so ordinary M4 code runs from QSPI unless enabled. Selected RAM entry</text>
<text x="84" y="1207.2" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">points do not prove that every helper or indirect call also executes from RAM.</text>
<path d="M60,1260 L1740,1260" fill="none" stroke="#D7E1E9" stroke-width="2"/>
<text x="60" y="1288" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#566B7B">2026-11-06  •  Last flashed Release test pair: bbe50064864223d7  •  Not a qualified production release</text>
<text x="60" y="1310" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start" fill="#566B7B">Sources: cmake/giga_fast_code.cmake; application_giga.cmake; linked ELF symbols / manifest; CMake cache for flashed test pair.</text>
