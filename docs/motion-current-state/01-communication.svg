<title id="title">How commands reach the motors</title>
<desc id="desc">Two private applications, two buses and two bridges; only serialized frames cross between cores.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566B7B"/></marker></defs>
<rect x="0" y="0" width="1800" height="1320" rx="0" fill="#F5F8FB"/>
<text x="60" y="53" font-family="DejaVu Sans" font-size="19" font-weight="700" text-anchor="start" fill="#566B7B">PROTOMATE  /  CURRENT IMPLEMENTATION</text>
<text x="60" y="110" font-family="DejaVu Sans" font-size="43" font-weight="700" text-anchor="start" fill="#183044">How commands reach the motors</text>
<text x="60" y="156" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#566B7B">Two private applications, two buses and two bridges; only serialized frames cross between cores.</text>
<text x="1740" y="61" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="end" fill="#566B7B">01 / 04</text>
<path d="M60,183 L1740,183" fill="none" stroke="#D7E1E9" stroke-width="2"/>
<rect x="60" y="215" width="790" height="354" rx="14" fill="#EDF4FE" stroke="#D7E1E9" stroke-width="1.5"/>
