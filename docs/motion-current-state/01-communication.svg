<text x="84" y="255" font-family="DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" fill="#245EA8">M7 · UI controller · 480 MHz</text>
<text x="974" y="255" font-family="DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" fill="#007D78">M4 · IO controller · 240 MHz</text>
