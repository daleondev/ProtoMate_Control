<text x="106" y="353.0" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">Commands and</text>
<text x="106" y="375.95" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">presentation</text>
<rect x="346" y="281" width="218" height="116" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="368" y="316.0" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#245EA8">Motion client</text>
<text x="368" y="353.0" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">Tracks requests</text>
<text x="368" y="375.95" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">and job history</text>
<rect x="608" y="281" width="218" height="116" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="630" y="316.0" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#245EA8">Planning</text>
<text x="630" y="353.0" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">Conversions, paths</text>
<text x="630" y="375.95" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">and profiles</text>
<path d="M308,339 L337,339" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M570,339 L599,339" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="84" y="435" width="742" height="108" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="106" y="470.0" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start" fill="#245EA8">Private pneumo bus ↔ ICC Bridge</text>
<text x="106" y="514.5" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">One ICC coroutine context / worker (priority 4). All three lanes</text>
<text x="106" y="542.85" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">dispatch here.</text>
<path d="M455,398 L455,432" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="974" y="281" width="218" height="116" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="996" y="316.0" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">Controller</text>
<text x="996" y="353.0" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">Admission and</text>
<text x="996" y="375.95" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">ownership</text>
<rect x="1236" y="281" width="218" height="116" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="1258" y="316.0" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">Executor</text>
<text x="1258" y="353.0" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">Profiles → pulse</text>
<text x="1258" y="375.95" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">schedules</text>
<rect x="1498" y="281" width="218" height="116" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="1520" y="316.0" font-family="DejaVu Sans" font-size="20" font-weight="700" text-anchor="start" fill="#007D78">TIM2 + DMA</text>
<text x="1520" y="353.0" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">Three physical</text>
<text x="1520" y="375.95" font-family="DejaVu Sans" font-size="17" font-weight="400" text-anchor="start" fill="#183044">STEP outputs</text>
<path d="M1198,339 L1227,339" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1460,339 L1489,339" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="974" y="435" width="742" height="108" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="996" y="470.0" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start" fill="#007D78">Private pneumo bus ↔ ICC Bridge</text>
<text x="996" y="514.5" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">One ICC coroutine context / worker (priority 4). Execution runs in</text>
<text x="996" y="542.85" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">separate workers.</text>
<path d="M1083,432 L1083,399" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M455,574 L455,631" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M1345,574 L1345,631" fill="none" stroke="#566B7B" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="610" font-family="DejaVu Sans" font-size="20" font-weight="400" text-anchor="start" fill="#566B7B">encode / decode</text>
<text x="1370" y="610" font-family="DejaVu Sans" font-size="20" font-weight="400" text-anchor="start" fill="#566B7B">encode / decode</text>
<rect x="60" y="638" width="1680" height="303" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="84" y="678" font-family="DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" fill="#A8680C">Shared SRAM4 · three independent queues in each direction</text>
<text x="1716" y="677" font-family="DejaVu Sans" font-size="20" font-weight="400" text-anchor="end" fill="#566B7B">6 queues total</text>
<rect x="84" y="704" width="520" height="168" rx="14" fill="#FFF0F1" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="104" y="741" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#B63B43">URGENT</text>
<text x="104" y="774" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Stop, cancel, lease and link control</text>
<text x="104" y="803" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#566B7B">Up to 2,048 bytes per frame</text>
<rect x="104" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#B63B43" stroke-width="1.5"/>
<rect x="143" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#B63B43" stroke-width="1.5"/>
<rect x="182" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#B63B43" stroke-width="1.5"/>
<rect x="221" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#B63B43" stroke-width="1.5"/>
<text x="274" y="844" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#566B7B">4 slots per direction</text>
<rect x="640" y="704" width="520" height="168" rx="14" fill="#EDF4FE" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="660" y="741" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#245EA8">NORMAL</text>
<text x="660" y="774" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Preparation, actions, replies and state</text>
<text x="660" y="803" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#566B7B">Up to 2,048 bytes per frame</text>
<rect x="660" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#245EA8" stroke-width="1.5"/>
<rect x="699" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#245EA8" stroke-width="1.5"/>
<rect x="738" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#245EA8" stroke-width="1.5"/>
<rect x="777" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#245EA8" stroke-width="1.5"/>
<text x="830" y="844" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#566B7B">4 slots per direction</text>
<rect x="1196" y="704" width="520" height="168" rx="14" fill="#FFF5DF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="1216" y="741" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#A8680C">BACKGROUND</text>
<text x="1216" y="774" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">IO logs → UI → USB console</text>
<text x="1216" y="803" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#566B7B">Up to 512 bytes per frame</text>
<rect x="1216" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#A8680C" stroke-width="1.5"/>
<rect x="1255" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#A8680C" stroke-width="1.5"/>
<rect x="1294" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#A8680C" stroke-width="1.5"/>
<rect x="1333" y="824" width="29" height="25" rx="4" fill="#FFFFFF" stroke="#A8680C" stroke-width="1.5"/>
<text x="1386" y="844" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#566B7B">4 slots per direction</text>
<text x="84" y="914" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">HSEM is the doorbell: it wakes a notification worker. The message bytes remain in shared memory.</text>
<rect x="60" y="975" width="812" height="249" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="82" y="1010.0" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="start" fill="#183044">What crosses the bridge</text>
<text x="84" y="1051" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" fill="#183044">Services</text>
<text x="230" y="1051" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">request → deferred reply</text>
<text x="84" y="1090" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" fill="#183044">Actions</text>
<text x="230" y="1090" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">acceptance → progress → terminal result</text>
<text x="84" y="1129" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" fill="#183044">Topics</text>
<text x="230" y="1129" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">latest motor state at 20 Hz; bounded logs</text>
<text x="84" y="1170.0" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#566B7B">Routes are declared in common/icc/catalog/{services,actions,topics}.hpp.</text>
<rect x="908" y="975" width="832" height="249" rx="14" fill="#FFF5DF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="930" y="1010.0" font-family="DejaVu Sans" font-size="27" font-weight="700" text-anchor="start" fill="#A8680C">Separate budgets, shared dispatch</text>
<text x="932" y="1050.0" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Urgent traffic has its own capacity, but it still needs CPU time in the</text>
<text x="932" y="1080.8" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#183044">same ICC context.</text>
<path d="M932,1113 L1716,1113" fill="none" stroke="#D7E1E9" stroke-width="2"/>
<text x="932" y="1149" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">UI lease: renew every 50 ms · expires after 250 ms</text>
<text x="932" y="1184" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">M4 execution: 40 ms renewal · 80 ms commit frontier</text>
<path d="M60,1260 L1740,1260" fill="none" stroke="#D7E1E9" stroke-width="2"/>
