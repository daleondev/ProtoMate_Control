<text x="684" y="644" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#245EA8">AXI private region · 256 KiB</text>
<text x="684" y="676" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" text-anchor="start" fill="#183044">0x24000000 → 0x24040000</text>
<text x="684" y="707.0" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Static data and ordinary heap.</text>
<text x="684" y="733.6" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Actual heap capacity: 234,336 B.</text>
<rect x="664" y="775" width="472" height="103" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="686" y="810.0" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#245EA8">Thread stacks use RAM too</text>
<text x="686" y="848.25" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">Most workers allocate stacks from their core’s</text>
<text x="686" y="872.55" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">heap. The planner has a static DTCM stack.</text>
<text x="664" y="919" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#566B7B">An 8 KiB interrupt stack is not a thread pool.</text>
<rect x="1244" y="288" width="472" height="119" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="1264" y="321" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#A8680C">SRAM4 · 64 KiB</text>
<text x="1264" y="351" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x38000000 · ICC reserve: 60 KiB</text>
<text x="1264" y="378" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">49,312 B used; final 4 KiB: boot handoff</text>
<text x="1244" y="446" font-family="DejaVu Sans" font-size="25" font-weight="700" text-anchor="start" fill="#A8680C">External SDRAM · 8 MiB</text>
<rect x="1244" y="467" width="472" height="103" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="1264" y="499" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#A8680C">Framebuffers · 4 MiB reserved</text>
<text x="1264" y="530" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" text-anchor="start" fill="#183044">0xC0000000 · non-cacheable</text>
<text x="1264" y="555" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Two images, 1,228,800 B each</text>
<rect x="1244" y="583" width="472" height="103" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
