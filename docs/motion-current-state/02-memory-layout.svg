<text x="684" y="442" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#245EA8">DTCM · 128 KiB</text>
<text x="684" y="475" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x20000000: vectors, 2 KiB</text>
<text x="684" y="503" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x20000800: data, 110 KiB</text>
<text x="684" y="531" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x2001C000: gap, 8 KiB</text>
