<text x="1264" y="530" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" text-anchor="start" fill="#183044">0xC0000000 · non-cacheable</text>
<text x="1264" y="555" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Two images, 1,228,800 B each</text>
<rect x="1244" y="583" width="472" height="103" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
