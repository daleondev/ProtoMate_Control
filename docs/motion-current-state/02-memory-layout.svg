<text x="1264" y="378" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">49,312 B used; final 4 KiB: boot handoff</text>
<text x="1244" y="446" font-family="DejaVu Sans" font-size="25" font-weight="700" text-anchor="start" fill="#A8680C">External SDRAM · 8 MiB</text>
