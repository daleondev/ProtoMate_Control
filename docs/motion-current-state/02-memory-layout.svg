<text x="684" y="320" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#245EA8">ITCM · 64 KiB</text>
<text x="684" y="351" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" text-anchor="start" fill="#183044">0x00000000 · 16,088 B linked</text>
