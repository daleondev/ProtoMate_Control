<text x="684" y="442" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#245EA8">DTCM · 128 KiB</text>
<text x="684" y="475" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x20000000: vectors, 2 KiB</text>
<text x="684" y="503" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x20000800: data, 110 KiB</text>
<text x="684" y="531" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x2001C000: gap, 8 KiB</text>
<text x="684" y="559" font-family="DejaVu Sans Mono" font-size="17" font-weight="400" text-anchor="start" fill="#183044">0x2001E000: interrupt stack, 8 KiB</text>
<rect x="664" y="612" width="472" height="143" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="684" y="644" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#245EA8">AXI private region · 256 KiB</text>
<text x="684" y="676" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" text-anchor="start" fill="#183044">0x24000000 → 0x24040000</text>
<text x="684" y="707.0" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Static data and ordinary heap.</text>
<text x="684" y="733.6" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Heap capacity is checked at runtime.</text>
<rect x="664" y="775" width="472" height="103" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="686" y="810.0" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#245EA8">Thread stacks use RAM too</text>
<text x="686" y="848.25" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">The UI planner has a static DTCM stack. Other</text>
<text x="686" y="872.55" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#183044">UI workers consume private RAM.</text>
<text x="664" y="919" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#566B7B">An 8 KiB interrupt stack is not a thread pool.</text>
<rect x="1244" y="288" width="472" height="119" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="1264" y="321" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#A8680C">SRAM4 · 64 KiB</text>
