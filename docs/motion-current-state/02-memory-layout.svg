<text x="106" y="693.0" font-family="DejaVu Sans" font-size="19" font-weight="700" text-anchor="start" fill="#007D78">8 KiB interrupt stack · 0x30046000</text>
<rect x="84" y="738" width="472" height="140" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="104" y="771" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#007D78">AXI heap region · 256 KiB</text>
<text x="104" y="803" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" text-anchor="start" fill="#183044">0x24040000 → 0x24080000</text>
<text x="104" y="834.0" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Unwind metadata precedes the heap.</text>
<text x="104" y="860.6" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#183044">Actual allocator capacity: 248,920 B.</text>
<text x="84" y="919" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#566B7B">The SRAM alias is not additional memory.</text>
