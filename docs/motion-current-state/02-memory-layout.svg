<text x="1264" y="646" font-family="DejaVu Sans Mono" font-size="18" font-weight="400" text-anchor="start" fill="#183044">0xC0480000 · code: 1536 KiB</text>
<text x="1264" y="671" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#566B7B">0xC0400000 · profiling: 512 KiB</text>
