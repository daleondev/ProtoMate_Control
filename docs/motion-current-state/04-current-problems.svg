<text x="942" y="315.0" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">“No more processes”</text>
<text x="942" y="344.4" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">Thread creation returned</text>
