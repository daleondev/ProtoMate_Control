<text x="84" y="531" font-family="DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" fill="#007D78">Observed pressure: M4 runtime heap</text>
<text x="84" y="570" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#566B7B">Snapshot taken after the failure · capacity 248,920 B</text>
