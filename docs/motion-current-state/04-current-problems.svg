<rect x="0" y="0" width="1800" height="1320" rx="0" fill="#F5F8FB"/>
<text x="60" y="53" font-family="DejaVu Sans" font-size="19" font-weight="700" text-anchor="start" fill="#566B7B">PROTOMATE  /  CURRENT IMPLEMENTATION</text>
<text x="60" y="110" font-family="DejaVu Sans" font-size="43" font-weight="700" text-anchor="start" fill="#183044">What is actually stopping us now?</text>
<text x="60" y="156" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#566B7B">The latest GIGA workflow fails while creating the next homing worker. The exact resource failure is not isolated.</text>
<text x="1740" y="61" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="end" fill="#566B7B">04 / 04</text>
