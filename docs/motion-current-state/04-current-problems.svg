<text x="84" y="689" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="start" fill="#007D78">24,016 B free in total</text>
<text x="84" y="726" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#183044">15 free blocks · largest usable block was not reported</text>
<path d="M84,753 L918,753" fill="none" stroke="#D7E1E9" stroke-width="2"/>
<text x="84" y="794" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#183044">Starting a homing worker requires</text>
<rect x="84" y="816" width="365" height="84" rx="14" fill="#EAF7F4" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="106" y="851.0" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start" fill="#007D78">16 KiB stack</text>
<text x="466" y="867" font-family="DejaVu Sans" font-size="32" font-weight="700" text-anchor="start" fill="#566B7B">+</text>
<rect x="505" y="816" width="413" height="84" rx="14" fill="#EAF7F4" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="527" y="851.0" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#007D78">Control / TLS allocations</text>
<text x="84" y="939.0" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#566B7B">Total free memory alone does not establish whether this allocation sequence</text>
<text x="84" y="968.4" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#566B7B">could succeed at the instant of failure.</text>
<rect x="978" y="488" width="762" height="501" rx="14" fill="#FFFFFF" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="1002" y="531" font-family="DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" fill="#183044">Known vs. still unproven</text>
<text x="1002" y="579" font-family="DejaVu Sans" font-size="19" font-weight="700" text-anchor="start" fill="#B63B43">KNOWN</text>
<text x="1002" y="617.0" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">The full robot homing sequence is broken on GIGA. Homing</text>
<text x="1002" y="649.2" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">workers are created dynamically; EAGAIN can come from</text>
<text x="1002" y="681.4" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">several runtime creation paths.</text>
<text x="1002" y="743" font-family="DejaVu Sans" font-size="19" font-weight="700" text-anchor="start" fill="#A8680C">NOT ESTABLISHED</text>
<text x="1002" y="780.0" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">Which allocation or ThreadX operation failed. Heap</text>
<text x="1002" y="812.2" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#183044">fragmentation is a hypothesis, not a confirmed diagnosis.</text>
<path d="M1002,862 L1716,862" fill="none" stroke="#D7E1E9" stroke-width="2"/>
<text x="1002" y="903.0" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#566B7B">Internal code/data regions are also tight: M4 fast code is 99.32%</text>
<text x="1002" y="933.8" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#566B7B">full; static data/DMA is 96.11% full.</text>
