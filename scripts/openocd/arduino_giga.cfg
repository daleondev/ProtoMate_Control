# GIGA R1 WiFi / STM32H747XIH6. Atmel-ICE SAM connector, 3V3 VTref,
# SWDIO/SWCLK/NRST/GND; power the board independently through USB-C.
source [find interface/cmsis-dap.cfg]
transport select swd
set CHIPNAME giga
set DUAL_CORE 1
set DUAL_BANK 1
set QUADSPI 1
set USE_CTI 0
source [find target/stm32h7x.cfg]
adapter speed 1000
# Factory firmware can leave the M7 inaccessible until reset. The CMSIS-DAP
# target script accesses DBGMCU through AP2, which works with NRST asserted.
reset_config srst_only srst_nogate connect_assert_srst
# Avoid the target script's default 4 MHz reset speed.
giga.cpu0 configure -event reset-init { adapter speed 1000 }
# Maintenance workspace. Neither work area overlaps ICC, handoff, helper,
# helper globals or either bootstrap's MSP. Applications are stopped first.
giga.cpu0 configure -work-area-phys 0x24040000 -work-area-size 0x10000 -work-area-backup 1
giga.cpu1 configure -work-area-phys 0x30020000 -work-area-size 0x4000 -work-area-backup 1
# cpu0 (M7): GDB 3333; cpu1 (M4): GDB 3334. QSPI is probed only after helper.
proc giga_halt_both {} {
    targets giga.cpu0
    halt
    targets giga.cpu1
    halt
    targets giga.cpu0
}
